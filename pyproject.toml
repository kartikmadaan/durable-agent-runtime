[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "durable-agent-runtime"
version = "0.1.0"
description = "Crash-consistent durable execution engine for LLM agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
